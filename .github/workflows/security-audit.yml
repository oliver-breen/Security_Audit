name: Security Audit

on:
  schedule:
    # Run security audit weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '**.py'
      - '**.sh'
      - 'requirements.txt'
      - '.github/workflows/**'
  push:
    branches:
      - main

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pylint
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run Bandit security scanner
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt
          
      - name: Check Python dependencies for vulnerabilities
        run: |
          safety check --json || true
          
      - name: ShellCheck for shell scripts
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          
      - name: Check for sensitive files
        run: |
          # Check for common sensitive files that shouldn't be committed
          if find . -path ./vendor -prune -o -path ./.github -prune -o \( -name "*.key" -o -name "*.pem" -o -name "*.p12" -o -name "*.pfx" -o -name "secret*" -o -name ".env*" \) -print | head -1 | grep .; then
            echo "❌ Sensitive files detected!"
            exit 1
          else
            echo "✅ No sensitive files found"
          fi
          
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json
