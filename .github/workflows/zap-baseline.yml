name: ZAP Baseline Scan
on:
  schedule:
    - cron: "0 3 * * 0"  # weekly
  workflow_dispatch:
  pull_request:
    paths:
      - "vulnerable_app/**"
      - ".github/workflows/zap-baseline.yml"

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start vulnerable app
        working-directory: vulnerable_app
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          nohup python app.py >/tmp/app.log 2>&1 &
          sleep 5

      - name: ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://127.0.0.1:5000"
          fail_action: false
          rules_file_name: ""
          cmd_options: "-u http://127.0.0.1:5000"
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: |
            zap_report.html
            zap_report.md
